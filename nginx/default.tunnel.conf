# nginx routing for the Cloudflare Tunnel deployment (ADR-0055).
#
# TLS is terminated at Cloudflare's edge; cloudflared reaches this nginx over plain
# HTTP on :80 inside the Docker network. So there is no ssl_certificate / ACME here
# — this is the same path routing as default.prod.conf, minus TLS. X-Forwarded-Proto
# is pinned to https because the original client scheme was https at Cloudflare.

# Rate limits tuned for a public demo (ADR-0056). General API traffic is capped
# modestly; the anonymous write endpoints (auth register/login) are capped hard,
# since those are the prime spam target. Cloudflare edge rules sit in front of this.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Anonymous auth endpoints (register/login) — the prime spam/abuse target.
    # Hard cap: ~1 req/s with a small burst, per client IP.
    location /api/auth/ {
        set $auth_upstream http://api:8080;
        limit_req_status 429;
        limit_req zone=auth_limit burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        set $api_upstream http://api:8080;
        limit_req_status 429;
        limit_req zone=api_limit burst=16 nodelay;
        if ($request_uri ~ ^/api/notifications/) {
            set $api_upstream http://notification-service:8089;
        }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /actuator/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/assets/ {
        # Variable + resolver = resolution deferred to request time, so nginx starts
        # even if admin-web is momentarily unavailable (no startup flapping).
        set $admin_assets http://admin-web:80;
        proxy_pass $admin_assets/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        set $admin_upstream http://admin-web:80/;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
