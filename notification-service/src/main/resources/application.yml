spring:
  application:
    name: notification-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  # Kafka/Redpanda — rate-change stream SSE consumer (ADR-0052). The producer
  # (pricing-service) tags messages with ITS class name, which this service does
  # not have, so we ignore type headers and deserialize into the local record.
  kafka:
    # Continue the rate-change trace from pricing-service into the SSE consumer:
    # observation-enabled extracts the trace context from the message headers so
    # this consumer's span is a child of the producer's span (ADR-0030).
    listener:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.jaycodesx.mortgage.ratesheet.messaging.RateSheetActivatedMessage

app:
  # Rate-change stream toggle (ADR-0052). Enable this AND disable the RabbitMQ
  # consumer below so only one SSE broadcast path is active.
  kafka:
    enabled: ${APP_KAFKA_ENABLED:false}
    topic: ${APP_KAFKA_TOPIC:pricing.rate-sheet.activated}
  rabbitmq:
    consumer:
      enabled: ${APP_RABBITMQ_CONSUMER_ENABLED:false}
  messaging:
    enabled: ${APP_MESSAGING_ENABLED:true}
    consumer-enabled: ${APP_MESSAGING_CONSUMER_ENABLED:true}
    queue-name: ${APP_MESSAGING_QUEUE_NAME:quote-notification-events}
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
    region: ${AWS_REGION:us-east-1}
    poll-delay-ms: ${APP_MESSAGING_POLL_DELAY_MS:3000}
  service-token:
    public-key: ${APP_SERVICE_TOKEN_PUBLIC_KEY:}
    issuer: ${APP_SERVICE_TOKEN_ISSUER:mortgage-loan-api}
    audience: ${APP_SERVICE_TOKEN_AUDIENCE:notification-service}
    scope: ${APP_SERVICE_TOKEN_SCOPE:notification:write}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

server:
  port: 8089
