spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
app:
  seed:
    enabled: false
  messaging:
    enabled: false
    consumer-enabled: false
  service-token:
    key-id: harbor-test-key-1
    issuer: mortgage-loan-api
    audience: pricing-service
    scope: pricing:write
    ttl-seconds: 300
  user-token:
    issuer: auth-service
    audience: mortgage-loan-api
    ttl-seconds: 900
