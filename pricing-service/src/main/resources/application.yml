spring:
  application:
    name: pricing-service
  ai:
    mcp:
      server:
        name: harbor-pricing-mcp
        version: 1.0.0
        # SYNC = blocking request/response tools (matches our JPA/JDBC service).
        type: SYNC
        # SSE transport endpoints exposed by the WebMVC starter:
        #   GET  /sse            -> agent opens the event stream
        #   POST /mcp/message    -> agent sends tool calls
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  # Kafka/Redpanda — rate-change event stream (ADR-0052). Only exercised when
  # app.kafka.enabled=true; otherwise no producer sends and no listeners run.
  kafka:
    # observation-enabled makes Spring Kafka create producer/consumer spans AND
    # inject/extract the trace context into message headers — so a rate-change
    # trace continues across the broker into the audit + SSE consumers (ADR-0030).
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.jaycodesx.mortgage.pricing.messaging
        spring.json.value.default.type: com.jaycodesx.mortgage.pricing.messaging.RateSheetActivatedMessage
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/mortgage_pricing?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

harbor:
  # Agent-facing MCP boundary (ADR-0053). Secured + rate-limited independently of
  # the internal service-token flow below.
  mcp:
    # Locally the gateway is off so you can explore the MCP server with no key.
    # In any deployed environment set HARBOR_MCP_ENABLED=true and supply keys.
    enabled: ${HARBOR_MCP_ENABLED:false}
    # Comma-separated list of accepted API keys, injected from a secret. Never
    # commit real keys; the empty default means "no key accepted" when enabled.
    api-keys: ${HARBOR_MCP_API_KEYS:}
    # Per-key token-bucket size and per-minute refill.
    requests-per-minute: ${HARBOR_MCP_RPM:60}

app:
  # Rate-change event stream (ADR-0052). Off locally by default so the service
  # boots with no Redpanda; set true (and run Redpanda) to exercise the stream.
  kafka:
    enabled: ${APP_KAFKA_ENABLED:false}
    topic: ${APP_KAFKA_TOPIC:pricing.rate-sheet.activated}
  transport:
    type: ${APP_TRANSPORT_TYPE:noop}
  service-token:
    public-key: ${APP_SERVICE_TOKEN_PUBLIC_KEY:}
    issuer: ${APP_SERVICE_TOKEN_ISSUER:mortgage-loan-api}
    audience: ${APP_SERVICE_TOKEN_AUDIENCE:pricing-service}
    scope: ${APP_SERVICE_TOKEN_SCOPE:pricing:write}
  outbound-service-token:
    secret: ${APP_OUTBOUND_SERVICE_TOKEN_SECRET:}
    issuer: ${APP_OUTBOUND_SERVICE_TOKEN_ISSUER:pricing-service}
    audience: ${APP_OUTBOUND_SERVICE_TOKEN_AUDIENCE:lead-service}
    scope: ${APP_OUTBOUND_SERVICE_TOKEN_SCOPE:lead:write}
    ttl-seconds: ${APP_OUTBOUND_SERVICE_TOKEN_TTL_SECONDS:300}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  # Observability (ADR-0030). Vendor-neutral: we emit OTLP; the backend (local
  # otel-lgtm, or Grafana Cloud in prod) is only an endpoint change.
  tracing:
    sampling:
      # Record every trace in dev so nothing is missed while demonstrating.
      # In production this drops to a small fraction (e.g. 0.05).
      probability: ${MANAGEMENT_TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      # otel-lgtm's OTLP/HTTP receiver. Overridden to http://otel-lgtm:4318/...
      # when running inside docker-compose.
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

server:
  port: 8084
